<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勇者旅途 · 完整动作第一批</title><style>body{margin:0;padding:28px;background:#222d2c;color:#efe8d8;font:16px system-ui}h1{font-size:24px}p{color:#c4c7b7;line-height:1.7}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}button,select{padding:10px 16px;background:#465747;color:#fff5da;border:1px solid #9e926c;border-radius:5px;font:inherit}input{accent-color:#e1b56c}main{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}article{flex:1;min-width:280px}canvas{width:100%;background:linear-gradient(#324341,#454e3e);border-bottom:2px solid #8e825d}h2{font-size:19px}a{color:#edc17e}.note{font-size:13px}#status{min-height:24px}</style><h1>勇者旅途 · 三职业完整动作第一批</h1><p>男短发／默认穿搭 · 136 帧样段。用于检查动作与服装，尚未替换正式游戏。可以切动作、反向、慢放和逐帧观察。</p><div class="controls"><select id="action" aria-label="动作"><option value="idle">待机</option><option value="walk">行走</option><option value="run">奔跑</option><option value="jump">跳跃到落地</option><option value="hurt">受击</option><option value="attack0">攻击第一段</option><option value="attack1">战士第二段</option><option value="attack2">战士第三段</option></select><button id="play">暂停</button><button id="next">下一帧</button><button id="flip">朝向：右</button><label>速度 <input id="fps" type="range" min="1" max="16" value="8"><span id="speed">8 帧/秒</span></label><label>帧 <input id="frame" type="range" min="0" max="3" value="0"><span id="num">1 / 4</span></label></div><p id="status">加载素材…</p><main id="main"></main><p class="note">上方放大观察，下方约为游戏中的显示尺寸。角色整体等比缩放，服装和肢体没有被拆开旋转。射手与法师在战士专属连击选项下保持待机。</p><p><a href="素材补全清单.md">素材范围</a> · <a href="batch1-review.md">本批验收记录</a> · <a href="index.html">原攻击样段</a></p><script>
'use strict';
const $=id=>document.getElementById(id),base='../../assets/characters/wholeframe-v33/',names={warrior:'战士',archer:'射手',mage:'法师'},items=[],cache=new Map();let manifest,ready=false,running=true,f=0,last=0,left=false;
for(const [cls,name] of Object.entries(names)){const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><canvas width="480" height="570"></canvas><p class="note" data-note></p>`;$('main').append(article);items.push({cls,c:article.querySelector('canvas'),note:article.querySelector('[data-note]')});}
function rec(cls){return manifest.classes[cls][$('action').value]||manifest.classes[cls].idle;}
function count(){return Math.max(...items.map(i=>rec(i.cls).frames));}
function draw(){if(!ready)return;const n=count();f%=n;$('frame').max=n-1;$('frame').value=f;$('num').textContent=(f+1)+' / '+n;for(const item of items){const r=rec(item.cls),im=cache.get(r.path),ff=f%r.frames,x=item.c.getContext('2d');x.clearRect(0,0,480,570);const sx=ff%4*512,sy=Math.floor(ff/4)*512;x.save();if(left){x.translate(480,0);x.scale(-1,1);}x.drawImage(im,sx,sy,512,512,10,5,460,460);x.drawImage(im,sx,sy,512,512,165,414,150,150);x.restore();x.strokeStyle='#8b927b';x.beginPath();x.moveTo(0,409);x.lineTo(480,409);x.stroke();item.note.textContent=(manifest.classes[item.cls][$('action').value]?'':'此动作仅战士使用 · ')+`${ff+1} / ${r.frames}`;}}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放'};$('next').onclick=()=>{running=false;$('play').textContent='播放';f=(f+1)%count();draw()};$('frame').oninput=()=>{running=false;$('play').textContent='播放';f=+$('frame').value;draw()};$('fps').oninput=()=>$('speed').textContent=$('fps').value+' 帧/秒';$('flip').onclick=()=>{left=!left;$('flip').textContent='朝向：'+(left?'左':'右');draw()};$('action').onchange=()=>{f=0;draw()};
function tick(t){if(ready&&running&&t-last>=1000/+$('fps').value){last=t;f=(f+1)%count();draw()}requestAnimationFrame(tick)}
(async()=>{try{const res=await fetch(base+'motion-manifest.json');if(!res.ok)throw Error('清单加载失败');manifest=await res.json();await Promise.all(Object.values(manifest.classes).flatMap(v=>Object.values(v)).map(r=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{cache.set(r.path,im);resolve()};im.onerror=()=>reject(Error(r.path+'加载失败'));im.src=base+r.path})));ready=true;$('status').textContent='全部素材已加载。请重点观察走路抬膝、动作首尾、握持及武器形状。';draw();requestAnimationFrame(tick)}catch(e){$('status').textContent=e.message}})();
</script></html>
