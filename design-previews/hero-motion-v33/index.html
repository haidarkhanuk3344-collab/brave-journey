<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>勇者旅途 · 8 帧动作验证</title><style>body{margin:0;background:#232a29;color:#eee7d7;font:16px system-ui;padding:28px}h1{font-size:24px}button,input{accent-color:#d9af64}button{padding:9px 18px;background:#4c554b;color:white;border:1px solid #a99873;border-radius:6px;cursor:pointer}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}main{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}article{flex:1;min-width:300px}canvas{width:100%;background:linear-gradient(#303c3c,#41483b);border-bottom:2px solid #85744b}h2{font-size:19px}p{color:#c3c1b4;line-height:1.6}a{color:#e0b974}</style><h1>勇者旅途 · 三职业攻击动作验证</h1><p>第一轮完整帧样段，尚未接入游戏。上方放大观察，下方为小尺寸观察。已按完整人物轮廓提取并统一脚底；不拆分身体、不补间。姿势或装备形状的跳变仍需后续修正。</p><div class="controls"><button id="play">暂停</button><button id="next">下一帧</button><label>帧 <input id="frame" type="range" min="0" max="7" value="0"> <span id="num">1 / 8</span></label><label>速度 <input id="fps" type="range" min="2" max="12" value="8"> <span id="speed">8 帧/秒</span></label></div><main id="main"></main><script>
const names={warrior:'战士 · 挥剑',archer:'射手 · 拉弓释放',mage:'法师 · 持杖施法'},items=[];let running=true,f=0,last=0;
for(const [key,name] of Object.entries(names)){const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><canvas width="480" height="570"></canvas><p><a href="${key}-8frames.png" target="_blank">查看完整 8 帧图</a></p>`;main.append(article);const im=new Image();im.src='../../assets/characters/wholeframe-v33/'+key+'-attack.png';items.push({im,c:article.querySelector('canvas')});im.onload=draw;}
function draw(){num.textContent=(f+1)+' / 8';frame.value=f;for(const {im,c} of items){if(!im.complete||!im.naturalWidth)continue;const x=c.getContext('2d');x.clearRect(0,0,480,570);const w=im.naturalWidth/4,h=im.naturalHeight/2,s=Math.min(420/w,400/h),sx=(f%4)*w,sy=Math.floor(f/4)*h;x.drawImage(im,sx,sy,w,h,(480-w*s)/2,410-h*s,w*s,h*s);x.strokeStyle='#8b927b';x.beginPath();x.moveTo(0,412);x.lineTo(480,412);x.stroke();const small=.31;x.drawImage(im,sx,sy,w,h,(480-w*small)/2,555-h*small,w*small,h*small);}}
play.onclick=()=>{running=!running;play.textContent=running?'暂停':'播放'};next.onclick=()=>{running=false;play.textContent='播放';f=(f+1)%8;draw()};frame.oninput=()=>{running=false;play.textContent='播放';f=+frame.value;draw()};fps.oninput=()=>speed.textContent=fps.value+' 帧/秒';function tick(t){if(running&&t-last>=1000/+fps.value){last=t;f=(f+1)%8;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
